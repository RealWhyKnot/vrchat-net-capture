version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      pip:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "nuget"
    directories:
      - "/src/VRChatNetCapture"
      - "/src/VRChatNetCapture.Tests"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      nuget:
        update-types:
          - "minor"
          - "patch"
