name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v2026.6.23.0 or v2026.6.23.0-beta'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ github.event.inputs.tag }}

      - name: Wait for CI on the release commit
        uses: RealWhyKnot/workflows/wait-for-ci@v1
        with:
          sha: ${{ steps.release_tag.outputs.sha }}
          workflow: ci.yml
          timeout-minutes: '15'

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install lint tools
        shell: pwsh
        run: |
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up PSScriptAnalyzer
        uses: RealWhyKnot/workflows/setup-pssa@v1

      - name: Validate
        shell: pwsh
        run: |
          pwsh -NoProfile -File .github/lint/lint.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build distribution
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          ./build.ps1 -Version $version -Package

      - name: Locate release artifacts
        id: zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/VRChatNetCapture-*.zip | Select-Object -First 1
          if (-not $zip) { throw "No release zip found in dist/." }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          $manifest = Get-ChildItem dist/VRChatNetCapture-*.manifest.tsv | Select-Object -First 1
          if (-not $manifest) { throw "No release manifest found in dist/." }
          $integrityName = $zip.Name -replace '\.zip$', '.integrity.tsv'
          $integrity = Join-Path $zip.DirectoryName $integrityName
          $zipLine = "$hash`t$($zip.Length)`t$($zip.Name)"
          $manifestLines = Get-Content -LiteralPath $manifest.FullName -Encoding UTF8
          [System.IO.File]::WriteAllLines($integrity, [string[]](@($zipLine) + $manifestLines), [System.Text.UTF8Encoding]::new($false))
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "integrity=$integrity" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Checksums
        id: checksums
        uses: RealWhyKnot/workflows/checksums@v1
        with:
          archives: ${{ steps.zip.outputs.path }}
          manifest: "false"
          sidecar: "true"

      - name: Build release notes
        id: notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          ZIP_NAME: ${{ steps.zip.outputs.name }}
          ZIP_SHA: ${{ steps.zip.outputs.sha256 }}
        run: |
          $tag = $env:RELEASE_TAG
          $prev = & git describe --tags --abbrev=0 --exclude '*-*' "$tag^" 2>$null
          $found = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $range = if ($found -and $prev) { "$prev..$tag" } else { $tag }
          $subjects = git log --no-merges --format='- %s (%h)' $range |
            Where-Object { $_ -notmatch '\[skip changelog\]' } |
            ForEach-Object { $_ -replace ' \(\d{4}\.\d+\.\d+\.\d+(-([A-Fa-f0-9]{4}|beta))?\)', '' }
          if (-not $subjects) { $subjects = @('- Maintenance release') }
          $zipName = $env:ZIP_NAME
          $zipSha = $env:ZIP_SHA
          $integrityName = $zipName -replace '\.zip$', '.integrity.tsv'
          $body = (@(
            "## Changes",
            ""
          ) + $subjects + @(
            "",
            "## Downloads",
            "",
            "- $zipName",
            "- SHA256: $zipSha",
            "- Integrity details are attached as $integrityName."
          )) -join "`n"
          $path = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($path, $body, [System.Text.UTF8Encoding]::new($false))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          notes-file: ${{ steps.notes.outputs.path }}
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          draft-first: 'true'
          assets: |
            ${{ steps.zip.outputs.path }}
            ${{ steps.zip.outputs.integrity }}
            ${{ steps.checksums.outputs.sidecars }}
