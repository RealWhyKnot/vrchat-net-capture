name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  lint-test:
    name: dotnet + python checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install tools
        shell: pwsh
        run: |
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up PSScriptAnalyzer
        uses: RealWhyKnot/workflows/setup-pssa@v1

      - name: Lint and test
        shell: pwsh
        run: |
          pwsh -NoProfile -File .github/lint/lint.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  shell:
    name: shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shell tools
        shell: bash
        env:
          SHFMT_VERSION: 3.12.0
          SHFMT_SHA256: d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          shellcheck --version
          download="${RUNNER_TEMP}/shfmt"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 120 \
            --output "${download}" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          printf '%s  %s\n' "${SHFMT_SHA256}" "${download}" | sha256sum --check --strict
          sudo install -m 0755 "${download}" /usr/local/bin/shfmt
          shfmt --version

      - name: Set up actionlint
        uses: raven-actions/actionlint@v2

      - name: Run shell gate
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          bash .githooks/check-shell
