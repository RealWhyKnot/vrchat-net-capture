name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  lint-test:
    name: dotnet + python checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install tools
        shell: pwsh
        run: |
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery

      - name: Lint and test
        shell: pwsh
        run: |
          pwsh -NoProfile -File .github/lint/lint.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  shell:
    name: shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shell tools
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Set up actionlint
        uses: raven-actions/actionlint@v2

      - name: Run shell gate
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          bash .githooks/check-shell
