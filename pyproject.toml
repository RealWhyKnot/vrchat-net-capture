[project]
name = "vrchat-net-capture"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["typing-extensions==4.16.0; python_version >= '3.12'", "typing-extensions==4.11.0; python_version < '3.12'"]

[project.optional-dependencies]
capture = ["mitmproxy==12.3.0; python_version >= '3.12'"]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "pyright==1.1.414",
    "mitmproxy==12.3.0; python_version >= '3.12'",
    "mitmproxy==10.4.2; python_version < '3.12'",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vrchat_net_capture*"]
